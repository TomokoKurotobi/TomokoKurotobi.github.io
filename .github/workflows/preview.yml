name: Validate and publish PR preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate site content and links
        run: node scripts/check-site.mjs
      - name: Check JavaScript syntax
        run: |
          node --check js/site.js
          node --check pages/cooking/js/gallery.js
          node --check pages/games/memory/memory.js
          node --check scripts/build-dishes.mjs

  post_preview_url:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Set preview URL
        id: preview
        shell: bash
        run: |
          preview_url="https://raw.githack.com/${{ github.repository }}/${{ github.head_ref }}/index.html"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Create or update preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pr-static-preview -->';
            const body = `${marker}\n### Website preview\n\n[Open the branch preview](${process.env.PREVIEW_URL})\n\nThis preview updates automatically when the pull request changes.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes(marker) || comment.body.includes('raw.githack.com'))
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
